name: Agent CI

on:
  pull_request:
    branches:
    - develop
    - main
  push:
    branches:
    - develop

jobs:
  secrets:
    name: Scan secrets
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Scan hardcoded secrets
      uses: secret-scanner/action@0.2.1
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run lint
      uses: docker/build-push-action@v5
      with:
        file: ./Dockerfile.lint
        context: .
        push: false
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run tests
      uses: docker/build-push-action@v5
      with:
        file: ./Dockerfile.test
        outputs: type=local,dest=./artifacts
        context: .
        push: false
    - name: Report
      uses: mikepenz/action-junit-report@v4
      with:
        check_name: Small tests
        report_paths: 'artifacts/results-small.xml'
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v2
    - name: Build
      run: |
        make agent-arm
        GIT_SHA=`git rev-parse --short=12 HEAD`
        FILENAME=jacktrip-agent-arm-${GIT_SHA}.tar.gz
        tar cvzf ${FILENAME} ./jacktrip-agent-arm
        sha256sum ${FILENAME} | tee -a ${FILENAME}.sha256
    - name: Archive artifacts
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v3
      with:
        name: jacktrip-agent-arm
        path: jacktrip-agent-arm-*
